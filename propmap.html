<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五年命題地圖｜考古題解題學習站</title>
<meta name="description" content="111–115 學年度五科 550 題的命題主題對照表：每個主題在哪些年度出現、出現幾題、對應哪些記憶卡詞條。">
<script>
/* JS 錯誤計數器（headless 自檢用）：頁面掛載前就註冊，任何錯誤都會被記在 <html data-js-errors> */
document.documentElement.dataset.jsErrors = '0';
window.addEventListener('error', function () {
  var d = document.documentElement;
  d.dataset.jsErrors = String(Number(d.dataset.jsErrors || 0) + 1);
});
</script>
<link rel="stylesheet" href="assets/css/site.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6feb">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="考古題">
<style>
/* 五年命題地圖專用樣式（沿用 site.css 的 :root 變數與 .card / .chip 等類別） */
.pm-head{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);margin:18px 0}
.pm-head h1{margin:0 0 6px;font-size:26px;letter-spacing:.5px}
.pm-head p{margin:0;color:var(--ink-soft);font-size:15px}
.pm-stats{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.pm-stat{background:#f2f5f9;border-radius:999px;padding:5px 13px;font-size:13.5px;color:var(--ink-soft)}
.pm-stat b{color:var(--brand);font-size:15px;margin-right:3px}
.pm-note{margin:12px 0 0;color:var(--ink-mute);font-size:13px;line-height:1.7}
.pm-bars{display:flex;align-items:flex-end;gap:16px;margin:16px 0 0;padding-top:6px}
.pm-bcol{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1}
.pm-bn{font-size:13px;font-weight:700;color:var(--ink)}
.pm-bbar{width:100%;max-width:64px;background:linear-gradient(180deg,#62a8ff,var(--brand));
  border-radius:7px 7px 0 0;min-height:4px}
.pm-bv{font-size:12.5px;color:var(--ink-soft)}
.pm-tabs{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0 12px}
.pm-tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 15px;cursor:pointer;
  font:inherit;font-size:14px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.pm-tab:hover{border-color:#b9c9e6}
.pm-tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pm-tab i{font-style:normal;font-size:11.5px;background:#eef1f6;color:var(--ink-soft);border-radius:999px;padding:1px 8px}
.pm-tab.on i{background:rgba(255,255,255,.26);color:#fff}
.pm-sum{color:var(--ink-soft);font-size:13.5px;margin:0 0 12px}
.pm-sum b{color:var(--brand)}
.pm-row{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:7px;overflow:hidden}
.pm-row.open{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.pm-rhead{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}
.pm-rhead:hover{background:#fafcff}
.pm-no{font-size:11.5px;font-weight:700;color:#fff;background:#97a3b4;border-radius:6px;
  padding:2px 8px;min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.pm-row.open .pm-no{background:var(--brand)}
.pm-name{font-size:15px;font-weight:700;color:var(--ink)}
.pm-yrs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.pm-y{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#9aa6b8;
  background:#f2f5f9;border:1px solid #e6ebf3;border-radius:6px;padding:2px 7px;
  font-variant-numeric:tabular-nums}
.pm-y.hit{color:#fff;background:var(--brand);border-color:var(--brand)}
.pm-y b{font-size:10.5px;background:rgba(255,255,255,.3);border-radius:4px;padding:0 4px}
.pm-cnt{font-size:12.5px;color:var(--ink-mute);white-space:nowrap}
.pm-body{border-top:1px solid var(--line);background:#fbfcfe;padding:10px 16px 13px}
.pm-ent{display:flex;gap:14px;align-items:baseline;padding:6px 0;border-bottom:1px dashed #e8edf5;font-size:14px}
.pm-ent:last-child{border-bottom:none}
.pm-ent .et{color:#3a4657;line-height:1.7}
.pm-ent .er{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--brand);white-space:nowrap}
.pm-go{display:inline-block;font-size:12.5px;font-weight:700;border:1px solid #c9dcfb;background:#fff;
  border-radius:8px;padding:3px 11px;color:var(--brand);white-space:nowrap}
.pm-go:hover{background:var(--brand-soft);text-decoration:none}
.pm-sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);margin:18px 0}
.pm-sec h2{margin:0 0 4px;font-size:19px}
.pm-sec>p{margin:0 0 12px;color:var(--ink-soft);font-size:13.5px}
.pm-vtabs{display:flex;flex-wrap:wrap;gap:7px}
.pm-vtab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 14px;cursor:pointer;
  font:inherit;font-size:13.5px;font-weight:600;color:var(--ink-soft)}
.pm-vtab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pm-vtab i{font-style:normal;font-size:11px;margin-left:5px;opacity:.75}
.pm-vlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:5px;margin-top:13px}
.pm-vitem{display:flex;gap:10px;align-items:baseline;background:#fbfcfe;border:1px solid #eef2f8;
  border-radius:8px;padding:6px 11px;font-size:13.5px}
.pm-vw{font-weight:700;color:var(--ink);white-space:nowrap}
.pm-vm{color:var(--ink-soft);flex:1}
.pm-vr{font-size:11px;font-weight:600;color:var(--ink-mute);white-space:nowrap}
.pm-tip{font-size:14px;color:#3a4657;line-height:1.85;padding-left:16px;position:relative;margin:6px 0}
.pm-tip:before{content:"\25B8";position:absolute;left:0;color:var(--brand);font-weight:700}
.pm-foot{margin:22px 0 40px;color:var(--ink-mute);font-size:12.5px}
@media(max-width:700px){
  .pm-yrs{margin-left:0;width:100%}
  .pm-rhead{flex-wrap:wrap}
  .pm-ent{flex-wrap:wrap}
  .pm-ent .er{margin-left:0}
}
</style>
<script>
/* PWA：註冊 Service Worker，讓站台可安裝成 App、可離線使用 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</head>
<body>
<a class="skip" href="#app">跳到主要內容</a>

<header class="site-header">
  <div class="wrap head-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">題</span>
      <span class="brand-text">
        <span id="brand-title">考古題解題學習站</span>
        <small id="brand-sub"></small>
      </span>
    </a>
    <nav class="head-nav" id="head-nav" aria-label="科目導覽"></nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer class="site-footer"><div class="wrap" id="footer-text"></div></footer>

<!-- ① 索引檔：唯一的科目清單 -->
<script src="assets/js/subjects.js"></script>
<!-- ② 五年命題地圖資料（純資料，不含頁面程式碼） -->
<script src="assets/js/data/propmap.js"></script>
<script>
(function () {
  'use strict';
  var INDEX = window.EXAM_INDEX || {};
  var SITE = INDEX.site || {};
  var SUBS = INDEX.subjects || [];
  var D = window.EXAM_PROPMAP;
  var app = document.getElementById('app');
  var cur = D && D.subjects.length ? D.subjects[0].key : '';
  var openRow = null, curVocab = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function $(id) { return document.getElementById(id); }

  /* ---------- 外框（沿用站台同一套標記） ---------- */
  function chrome() {
    document.title = D.title + '｜' + (SITE.title || '考古題解題學習站');
    if ($('brand-title')) { $('brand-title').textContent = SITE.title || '考古題解題學習站'; }
    if ($('brand-sub')) { $('brand-sub').textContent = '五年命題地圖'; }
    var nav = $('head-nav');
    if (nav) {
      var h = '<a href="index.html">首頁</a>'
        + '<a href="quiz/index.html">學習資源</a>'
        + '<a href="events.html">2026 大事</a>'
        + '<a href="cross.html">一科練五科</a>'
        + '<a class="on" href="propmap.html">命題地圖</a>';
      for (var i = 0; i < SUBS.length; i++) {
        if (SUBS[i].id !== 'math-a' && SUBS[i].id !== 'physics' && SUBS[i].id !== 'chemistry'
            && SUBS[i].id !== 'english' && SUBS[i].id !== 'chinese') { continue; }
        h += '<a href="subject/' + esc(SUBS[i].id) + '/index.html">' + esc(SUBS[i].short || SUBS[i].name) + '</a>';
      }
      nav.innerHTML = h;
    }
    var ft = $('footer-text');
    if (ft) {
      var lines = (window.EXAM_INDEX && SITE.footer) || [];
      ft.innerHTML = lines.length ? lines.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('')
        : '<p>' + esc(SITE.title || '') + '</p>';
    }
  }

  /* ---------- 主體 ---------- */
  function head() {
    var s = D.stats;
    var bars = D.yearBars.map(function (b) {
      var mx = Math.max.apply(null, D.yearBars.map(function (x) { return x.n; })) || 1;
      var h = Math.max(6, Math.round(120 * b.n / mx));
      return '<div class="pm-bcol"><span class="pm-bn">' + b.y + '</span>'
        + '<span class="pm-bbar" style="height:' + h + 'px"></span>'
        + '<span class="pm-bv">' + b.n + ' 題</span></div>';
    }).join('');
    return '<section class="pm-head">'
      + '<h1>' + esc(D.title) + '</h1>'
      + '<p>' + esc(D.subtitle) + '</p>'
      + '<div class="pm-stats">'
      + '<span class="pm-stat"><b>' + s.topics + '</b>命題主題</span>'
      + '<span class="pm-stat"><b>' + s.entries + '</b>記憶卡詞條</span>'
      + '<span class="pm-stat"><b>' + s.vocab + '</b>英文單字</span>'
      + '<span class="pm-stat"><b>' + s.tips + '</b>跨科心法</span>'
      + '<span class="pm-stat"><b>' + s.questions + '</b>題（111–115）</span>'
      + '</div>'
      + '<p class="pm-note">' + esc(D.note) + '<br>下方長條是<b>各年度被詞條收錄的題數</b>（111–113 收錄較細，114–115 較精簡）。</p>'
      + '<div class="pm-bars">' + bars + '</div>'
      + '</section>';
  }

  function tabs() {
    return '<div class="pm-tabs">' + D.subjects.map(function (s) {
      return '<button class="pm-tab' + (s.key === cur ? ' on' : '') + '" data-k="' + esc(s.key) + '" type="button">'
        + esc(s.key) + '<i>' + s.tcount + '</i></button>';
    }).join('') + '</div>';
  }

  function rows() {
    var s = null, i;
    for (i = 0; i < D.subjects.length; i++) { if (D.subjects[i].key === cur) { s = D.subjects[i]; } }
    if (!s) { return ''; }
    var sum = '<p class="pm-sum">' + esc(s.key) + ' 共 <b>' + s.tcount + '</b> 個命題主題、<b>'
      + s.entries + '</b> 條詞條，五年共收錄 <b>' + s.qcount + '</b> 題。</p>';
    var body = s.topics.map(function (t) {
      var key = s.key + '|' + t.no;
      var ys = D.years.map(function (y) {
        var a = t.years[y] || [];
        return '<span class="pm-y' + (a.length ? ' hit' : '') + '" title="'
          + (a.length ? y + ' 學年度 第 ' + a.join('、') + ' 題' : y + ' 學年度未出現') + '">'
          + y + (a.length ? '<b>' + a.length + '</b>' : '') + '</span>';
      }).join('');
      var h = '<div class="pm-row' + (openRow === key ? ' open' : '') + '" data-k="' + esc(key) + '">'
        + '<div class="pm-rhead">'
        + '<span class="pm-no">' + t.no + '</span>'
        + '<span class="pm-name">' + esc(t.name) + '</span>'
        + '<span class="pm-yrs">' + ys + '</span>'
        + '<span class="pm-cnt">' + t.nentries + ' 條</span>'
        + '<a class="pm-go" href="subject/' + esc(s.id) + '/index.html">看題庫 ▸</a>'
        + '</div>';
      if (openRow === key) {
        h += '<div class="pm-body">' + t.entries.map(function (e) {
          return '<div class="pm-ent"><span class="et">' + esc(e.t) + '</span>'
            + '<span class="er">' + esc(e.refs.join('、')) + '</span></div>';
        }).join('') + '</div>';
      }
      return h + '</div>';
    }).join('');
    return sum + body;
  }

  function vocab() {
    var total = D.vocab.reduce(function (a, v) { return a + v.items.length; }, 0);
    var h = '<section class="pm-sec"><h2>英文單字卡</h2>'
      + '<p>依年度分組，共 ' + total + ' 字；點年度展開，每字附出處題號。</p>'
      + '<div class="pm-vtabs">';
    for (var i = 0; i < D.vocab.length; i++) {
      var v = D.vocab[i];
      h += '<button class="pm-vtab' + (curVocab === v.y ? ' on' : '') + '" data-v="' + esc(v.y) + '" type="button">'
        + v.y + ' 學年度<i>' + v.items.length + '</i></button>';
    }
    h += '</div>';
    for (var j = 0; j < D.vocab.length; j++) {
      var w = D.vocab[j];
      if (curVocab !== w.y) { continue; }
      h += '<div class="pm-vlist">' + w.items.map(function (it) {
        return '<div class="pm-vitem"><span class="pm-vw">' + esc(it.w) + '</span>'
          + '<span class="pm-vm">' + esc(it.m) + '</span>'
          + '<span class="pm-vr">' + esc((it.refs || []).join('、')) + '</span></div>';
      }).join('') + '</div>';
    }
    return h + '</section>';
  }

  function tips() {
    return '<section class="pm-sec"><h2>跨科應試心法</h2>'
      + '<p>五科通用的作答動作。</p>'
      + D.tips.map(function (t) { return '<p class="pm-tip">' + esc(t) + '</p>'; }).join('')
      + '</section>';
  }

  function render() {
    var s = null;
    for (var i = 0; i < D.subjects.length; i++) { if (D.subjects[i].key === cur) { s = D.subjects[i]; } }
    app.innerHTML = head() + tabs() + (s ? rows() : '') + vocab() + tips()
      + '<p class="pm-foot">本頁由 <code>assets/js/data/propmap.js</code> 驅動；'
      + '資料為《各科记忆卡》111–115 學年度逐題歸類的統計觀察，不代表未來命題保證。</p>';
  }

  chrome();
  if (!D || !D.subjects) {
    app.innerHTML = '<p class="loading">資料讀取失敗：找不到 window.EXAM_PROPMAP。</p>';
  } else {
    curVocab = D.vocab.length ? D.vocab[0].y : null;
    render();
    app.addEventListener('click', function (e) {
      var t = e.target;
      var tab = t.closest ? t.closest('.pm-tab') : null;
      if (tab) { cur = tab.getAttribute('data-k'); openRow = null; render(); return; }
      var vt = t.closest ? t.closest('.pm-vtab') : null;
      if (vt) {
        var y = vt.getAttribute('data-v');
        curVocab = (curVocab === y) ? null : y;
        render(); return;
      }
      var go = t.closest ? t.closest('.pm-go') : null;
      if (go) { return; }
      var rh = t.closest ? t.closest('.pm-rhead') : null;
      if (rh) {
        var row = rh.parentNode, k = row.getAttribute('data-k');
        openRow = (openRow === k) ? null : k;
        render();
      }
    });
    /* 驗收用鉤子（與動畫頁同款：headless 自檢可讀） */
    window.__propmap = {
      ready: true, data: D,
      state: function () {
        return {
          subjects: D.subjects.length,
          topics: D.stats.topics,
          entries: D.stats.entries,
          vocab: D.stats.vocab,
          tips: D.stats.tips,
          yearBars: D.yearBars,
          cur: cur, openRow: openRow, curVocab: curVocab,
          rows: document.querySelectorAll('.pm-row').length,
          renderedEntries: document.querySelectorAll('.pm-ent').length,
          renderedVocab: document.querySelectorAll('.pm-vitem').length,
          errors: Number(document.documentElement.dataset.jsErrors || 0)
        };
      },
      pick: function (k) { cur = k; openRow = null; render(); },
      open: function (k) { openRow = k; render(); },
      vocab: function (y) { curVocab = y; render(); }
    };
  }
})();
</script>
</body>
</html>
